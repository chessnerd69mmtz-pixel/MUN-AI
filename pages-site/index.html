<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUN AI</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#152238;--muted:#667085;--line:#e6eaf0;--cyan:#16b8d4;--green:#24b47e;--purple:#8b5cf6;--pink:#ec4899;--orange:#f59e0b;--red:#ef476f;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.app{min-height:100vh;display:grid;grid-template-columns:275px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 15px;display:flex;flex-direction:column;gap:15px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#16b8d4,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px}.brand b{font-size:20px}.brand b span{color:#8b5cf6}.sub{font-size:9px;letter-spacing:.17em;color:#98a2b3;margin-top:2px}
.workspace{border:1px solid var(--line);background:#fafbfc;border-radius:13px;padding:11px}.workspace small{color:var(--muted);display:block}.workspace b{display:block;margin:2px 0 3px}
.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:11px;color:#475467}.nav button:hover{background:#f4f6f8}.nav button.active{background:#eef9fc;color:#0f7185;font-weight:800}
.sideActions{margin-top:auto;display:grid;gap:8px}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.primary{background:#17253a;color:#fff}.ghost{background:#eef2f6;color:#334155}
.main{padding:28px 30px 45px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#8b5cf6;font-weight:900;text-transform:uppercase}.top h1{margin:3px 0 6px;font-size:30px}.status{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px;color:var(--muted)}.status i{display:inline-block;width:7px;height:7px;background:#24b47e;border-radius:50%;margin-right:6px}
.hero,.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 6px 24px rgba(15,23,42,.035)}.hero{background:linear-gradient(135deg,#fff,#f8fbff)}.hero h2{margin:0 0 8px;font-size:26px}.hero p,.lead,.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.card h3{margin:0 0 6px}.accentC{border-top:4px solid var(--cyan)}.accentG{border-top:4px solid var(--green)}.accentP{border-top:4px solid var(--purple)}.accentO{border-top:4px solid var(--orange)}.accentR{border-top:4px solid var(--red)}.accentB{border-top:4px solid var(--blue)}
.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.label{display:block;font-size:12px;font-weight:850;color:#475467;margin-bottom:5px}.input,.textarea,.select{width:100%;padding:10px 11px;border:1px solid #d7dde7;border-radius:10px;background:#fff}.textarea{min-height:145px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.answer{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);padding:14px;border-radius:11px;line-height:1.65;min-height:100px}.notice{padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;font-size:13px}.doc{border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:9px}.doc b{display:block}.doc small{color:var(--muted)}
.footer{margin-top:18px;text-align:center;color:#98a2b3;font-size:12px}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.main{padding:18px}.grid,.row{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.top{display:block}.status{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var K="munai-pages-v1";
var state={};try{state=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){state={}};
state.profile=state.profile||{name:"MUN 1",country:"",committee:"",agenda:""};
state.keys=state.keys||{groq:"",mistral:"",unlimitless:""};
state.docs=Array.isArray(state.docs)?state.docs:[];
state.research=state.research||"";state.strategy=state.strategy||"";state.speech=state.speech||"";state.resolution=state.resolution||"";state.niv=state.niv||"";
var tab="home";
function save(){localStorage.setItem(K,JSON.stringify(state))}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])})}
var tabs=[["home","⌂","Home"],["profile","◎","Delegate Profile"],["research","⌕","Research"],["strategy","⚑","Strategy Lab"],["speech","◉","Speech Studio"],["resolution","▤","Resolution Studio"],["niv","✦","Niv AI"],["documents","▥","Saved Documents"],["settings","⚙","API Settings"]];
function title(){var m={home:"Home",profile:"Delegate Profile",research:"Research",strategy:"Strategy Lab",speech:"Speech Studio",resolution:"Resolution Studio",niv:"Niv AI",documents:"Saved Documents",settings:"API Settings"};return m[tab]||"MUN AI"}
function navHtml(){var h="";for(var i=0;i<tabs.length;i++){h+="<button class='"+(tab===tabs[i][0]?"active":"")+"' data-tab='"+tabs[i][0]+"'>"+tabs[i][1]+" &nbsp; "+tabs[i][2]+"</button>"}return h}
function pageHtml(){
 if(tab==="home")return "<section class='hero'><h2>Everything you need for committee, in one workspace.</h2><p>MUN AI keeps your delegation profile, research, strategy, speeches, resolutions and Niv coaching together. Your browser stores the workspace locally.</p></section><div class='grid'><div class='card accentC'><h3>Research</h3><p class='muted'>Build focused committee research from your agenda and country context.</p></div><div class='card accentP'><h3>Strategy</h3><p class='muted'>Turn your evidence into arguments, vulnerabilities, alliances and responses.</p></div><div class='card accentG'><h3>Committee ready</h3><p class='muted'>Keep drafts and preparation available across refreshes on this device.</p></div></div><div class='grid'><div class='card accentO'><h3>Your keys</h3><p class='muted'>API keys are entered by the user and stored only in this browser.</p></div><div class='card accentR'><h3>GitHub Pages</h3><p class='muted'>This version is deployed directly from your MUN-AI GitHub repository.</p></div><div class='card accentB'><h3>Documents</h3><p class='muted'>Save position papers, speeches and other working notes locally.</p></div></div>";
 if(tab==="profile")return "<section class='card'><h2>Delegate Profile</h2><p class='lead'>Set the context used by the browser AI tools.</p><div class='form'><div class='row'><div><label class='label'>MUN name</label><input class='input' id='name' value='"+esc(state.profile.name)+"'></div><div><label class='label'>Country</label><input class='input' id='country' value='"+esc(state.profile.country)+"'></div></div><div class='row'><div><label class='label'>Committee</label><input class='input' id='committee' value='"+esc(state.profile.committee)+"'></div><div><label class='label'>Agenda</label><input class='input' id='agenda' value='"+esc(state.profile.agenda)+"'></div></div><button class='btn primary' id='saveProfile'>Save profile</button></div></section>";
 if(tab==="settings")return "<section class='card'><h2>API Settings</h2><p class='lead'>Enter your own keys. They are saved only in this browser and are not committed to GitHub.</p><div class='form'><div><label class='label'>Groq API key</label><input class='input' id='groq' type='password' value='"+esc(state.keys.groq)+"' placeholder='gsk_...'></div><div><label class='label'>Mistral API key</label><input class='input' id='mistral' type='password' value='"+esc(state.keys.mistral)+"'></div><div><label class='label'>Unlimitless API key</label><input class='input' id='unlimitless' type='password' value='"+esc(state.keys.unlimitless)+"'></div><button class='btn primary' id='saveKeys'>Save keys locally</button><div class='toolbar'><a class='btn ghost' href='https://console.groq.com/keys' target='_blank'>Get Groq key</a><a class='btn ghost' href='https://console.mistral.ai/api-keys' target='_blank'>Get Mistral key</a><a class='btn ghost' href='https://unlimitless.ai/portal' target='_blank'>Get Unlimitless key</a></div><div class='notice'>Browser-side AI calls depend on the provider allowing requests from a web page. If a provider blocks browser requests, the page will still load and you can use the workspace and documents.</div></div></section>";
 if(tab==="research")return aiPage("Research","research","Generate a committee briefing with facts, frameworks, arguments, risks and source directions.","Build an evidence-focused briefing for my MUN committee agenda.");
 if(tab==="strategy")return aiPage("Strategy Lab","strategy","Turn your context into arguments, attacks, responses and alliance moves.","Give me 5 strongest arguments, 5 likely attacks with responses, 3 alliance targets and my top committee priority.");
 if(tab==="speech")return aiPage("Speech Studio","speech","Draft a natural spoken MUN speech from your current country and agenda.","Write a confident, diplomatic 90-second GSL speech.");
 if(tab==="resolution")return aiPage("Resolution Studio","resolution","Draft realistic preambulatory and operative clauses.","Draft a practical MUN resolution with implementable operative clauses.");
 if(tab==="niv")return aiPage("Niv AI","niv","Ask for a direct next move, response, POI or alliance approach.","Give me the next best move in committee and the exact wording I can use.");
 if(tab==="documents"){var list="";for(var i=0;i<state.docs.length;i++){list+="<div class='doc'><b>"+esc(state.docs[i].title)+"</b><small>"+new Date(state.docs[i].createdAt).toLocaleString()+"</small><div class='answer' style='margin-top:8px'>"+esc(state.docs[i].content)+"</div><div class='toolbar' style='margin-top:8px'><button class='btn ghost' data-copy='"+i+"'>Copy</button><button class='btn ghost' data-del='"+i+"'>Delete</button></div></div>"}if(!list)list="<div class='notice'>No saved documents yet.</div>";return "<section class='card'><h2>Saved Documents</h2><p class='lead'>Stored locally in this browser.</p><div class='form'><input class='input' id='docTitle' placeholder='Document title'><textarea class='textarea' id='docContent' placeholder='Paste or write a document here'></textarea><button class='btn primary' id='saveDoc'>Save document</button></div><div style='margin-top:18px'>"+list+"</div></section>"}
 return "";
}
function aiPage(h,mode,lead,def){return "<section class='card'><h2>"+h+"</h2><p class='lead'>"+lead+"</p><div class='form'><textarea class='textarea' id='prompt' placeholder='What should MUN AI do?'>"+esc(state[mode+"Prompt"]||def)+"</textarea><button class='btn primary' id='runAI'>Run "+h+"</button></div><div id='out' class='answer'>"+esc(state[mode]||"No output yet.")+"</div><div class='toolbar' style='margin-top:10px'><button class='btn ghost' id='saveOutput'>Save output as document</button></div></section>"}
function render(){
 document.getElementById("root").innerHTML="<div class='app'><aside class='sidebar'><div class='brand'><div class='mark'>M</div><div><b>MUN <span>AI</span></b><div class='sub'>DELEGATE INTELLIGENCE</div></div></div><div class='workspace'><small>Current workspace</small><b>"+esc(state.profile.name)+"</b><small>"+esc(state.profile.country||"Set country")+" · "+esc(state.profile.committee||"Set committee")+"</small></div><nav class='nav'>"+navHtml()+"</nav><div class='sideActions'><button class='btn primary' id='newMUN'>＋ New MUN workspace</button><button class='btn ghost' id='reset'>↻ Reset outputs</button></div></aside><main class='main'><header class='top'><div><div class='eyebrow'>"+esc(state.profile.name)+"</div><h1>"+title()+"</h1><div class='muted'>"+esc(state.profile.country||"Your delegation")+" · "+esc(state.profile.committee||"Committee not configured")+" · "+esc(state.profile.agenda||"Add an agenda")+"</div></div><div class='status'><i></i>GitHub Pages</div></header>"+pageHtml()+"<div class='footer'>MUN AI · chessnerd69mmtz-pixel.github.io/MUN-AI</div></main></div>";
 document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-tab");render()}});
 var np=document.getElementById("newMUN");if(np)np.onclick=function(){state.profile={name:"MUN 1",country:"",committee:"",agenda:""};state.docs=[];state.research="";state.strategy="";state.speech="";state.resolution="";state.niv="";save();render()};
 var rs=document.getElementById("reset");if(rs)rs.onclick=function(){state.research="";state.strategy="";state.speech="";state.resolution="";state.niv="";save();render()};
 if(tab==="profile"){document.getElementById("saveProfile").onclick=function(){state.profile.name=document.getElementById("name").value||"MUN 1";state.profile.country=document.getElementById("country").value;state.profile.committee=document.getElementById("committee").value;state.profile.agenda=document.getElementById("agenda").value;save();render()}}
 if(tab==="settings"){document.getElementById("saveKeys").onclick=function(){state.keys.groq=document.getElementById("groq").value.trim();state.keys.mistral=document.getElementById("mistral").value.trim();state.keys.unlimitless=document.getElementById("unlimitless").value.trim();save();alert("Keys saved locally in this browser.")}}
 if(["research","strategy","speech","resolution","niv"].indexOf(tab)>=0){document.getElementById("runAI").onclick=function(){runAI(tab)};document.getElementById("saveOutput").onclick=function(){var text=state[tab]||"";if(!text)return;state.docs.unshift({title:title(),content:text,createdAt:new Date().toISOString()});save();tab="documents";render()}}
 if(tab==="documents"){document.getElementById("saveDoc").onclick=function(){var c=document.getElementById("docContent").value.trim();if(!c)return;state.docs.unshift({title:document.getElementById("docTitle").value.trim()||"Untitled document",content:c,createdAt:new Date().toISOString()});save();render()};document.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(state.docs[Number(b.getAttribute("data-copy"))].content)}});document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){state.docs.splice(Number(b.getAttribute("data-del")),1);save();render()}})}
}
async function runAI(mode){
 var out=document.getElementById("out");var prompt=document.getElementById("prompt").value;state[mode+"Prompt"]=prompt;save();out.textContent="Working…";
 var key=state.keys.groq||state.keys.mistral;if(!key){out.textContent="Open API Settings and enter your own Groq or Mistral key first.";return}
 var groq=!!state.keys.groq;var endpoint=groq?"https://api.groq.com/openai/v1/chat/completions":"https://api.mistral.ai/v1/chat/completions";var model=groq?"openai/gpt-oss-120b":"mistral-small-latest";
 var system="You are MUN AI, a careful Model UN preparation assistant. Country: "+state.profile.country+" Committee: "+state.profile.committee+" Agenda: "+state.profile.agenda+". Do not invent sources or facts.";
 var user=prompt+"\\n\\nCurrent research:\\n"+state.research+"\\n\\nAnswer in a useful, structured way for a student delegate.";
 try{var r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:model,temperature:.25,messages:[{role:"system",content:system},{role:"user",content:user}]})});var txt=await r.text();var d={};try{d=JSON.parse(txt)}catch(e){}if(!r.ok)throw new Error((d.error&&d.error.message)||("AI request failed ("+r.status+")"));var ans=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"No answer returned.";state[mode]=ans;save();out.textContent=ans}catch(e){out.textContent=e.message||"AI request failed."}
}
render();
</script>
</body>
</html>
