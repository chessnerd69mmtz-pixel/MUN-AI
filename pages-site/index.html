<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUN AI</title>
<style>
:root{
--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--ink:#17243a;--muted:#667085;--line:#e4e9f1;
--cyan:#11b7d1;--green:#1fa774;--purple:#7c5cff;--pink:#e64a9b;--orange:#f4a11a;--red:#ee4770;--blue:#3c82f6;
--shadow:0 12px 34px rgba(20,32,55,.07);--shadow2:0 5px 18px rgba(20,32,55,.06)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none}
.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{background:rgba(255,255,255,.98);border-right:1px solid var(--line);padding:20px 15px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 5px 8px}
.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;display:grid;place-items:center;font-weight:950;font-size:20px;box-shadow:0 8px 20px rgba(124,92,255,.24)}
.brand b{font-size:20px;letter-spacing:-.02em}.brand b span{color:var(--purple)}.sub{font-size:9px;letter-spacing:.17em;color:#98a2b3;margin-top:2px}
.workspace{border:1px solid var(--line);background:linear-gradient(135deg,#fafbfd,#f6f9fc);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow2)}
.workspace small{color:var(--muted);display:block;font-size:11px}.workspace b{display:block;margin:4px 0;font-size:14px}
.agenda-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.agenda-mini div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.agenda-mini small{font-size:10px;color:#98a2b3}.agenda-mini strong{display:block;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:11px;color:#475467;transition:.16s}.nav button:hover{background:#f3f6f8;transform:translateX(1px)}.nav button.active{background:linear-gradient(135deg,#ecfbfe,#f0ecff);color:#166b7b;font-weight:850;box-shadow:inset 3px 0 0 var(--cyan)}
.sideActions{margin-top:auto;display:grid;gap:8px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:850;transition:.16s}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#18263a,#253750);color:#fff;box-shadow:0 8px 18px rgba(23,37,58,.16)}.ghost{background:#eef2f6;color:#334155}.light{background:#fff;border:1px solid var(--line);color:#475467}
.main{padding:28px 30px 50px;min-width:0}.top{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--purple);font-weight:950;text-transform:uppercase}.top h1{margin:4px 0 7px;font-size:31px;line-height:1.05;letter-spacing:-.03em}.status{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow2)}.status i{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px}
.hero{background:linear-gradient(135deg,#fff,#f5fbff 45%,#faf7ff);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.hero h2{margin:0 0 9px;font-size:27px;line-height:1.14;letter-spacing:-.02em}.hero p{margin:0;max-width:980px;color:var(--muted);line-height:1.7}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:17px}
.agenda-board{display:grid;grid-template-columns:1fr 1fr;gap:11px}.agenda-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}.agenda-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--cyan)}.agenda-card.a2:before{background:var(--purple)}.agenda-card small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#98a2b3;font-weight:900}.agenda-card b{display:block;margin-top:6px;font-size:15px}.agenda-card p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow2)}.card h2,.card h3{margin:0 0 7px}.card h2{font-size:22px;letter-spacing:-.02em}.card h3{font-size:16px}.lead,.muted{color:var(--muted);line-height:1.63}.accentC{border-top:4px solid var(--cyan)}.accentG{border-top:4px solid var(--green)}.accentP{border-top:4px solid var(--purple)}.accentO{border-top:4px solid var(--orange)}.accentR{border-top:4px solid var(--red)}.accentB{border-top:4px solid var(--blue)}
.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{display:block;font-size:12px;font-weight:900;color:#475467;margin-bottom:6px}.input,.textarea,.select{width:100%;padding:11px 12px;border:1px solid #d6dde8;border-radius:11px;background:#fff;color:var(--ink);outline:none;transition:.15s}.input:focus,.textarea:focus,.select:focus{border-color:#9c8cff;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.textarea{min-height:145px;resize:vertical;line-height:1.55}
.agenda-picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#f7f8fb;border:1px solid var(--line);border-radius:12px}.agenda-picker .label{margin:0 3px 0 0}.focus-btn{border:1px solid #d6dde8;background:#fff;color:#475467;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.focus-btn.active{background:#17253a;color:#fff;border-color:#17253a}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.meta-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.meta-chip{padding:7px 9px;background:#f4f6f9;border:1px solid #e5e9ef;border-radius:999px;font-size:11px;font-weight:800;color:#526072}
.response-shell{margin-top:15px;border:1px solid #dfe5ee;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(20,32,55,.05)}.response-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fbfcfe,#f8fbff)}.response-title{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5d6878}.response-provider{font-size:11px;font-weight:850;padding:6px 8px;border-radius:999px;background:#edf8f1;color:#13704e}.response-content{padding:20px 22px 24px;line-height:1.68;color:#26364f;font-size:14px}.response-content p{margin:0 0 13px}.resp-heading{font-size:18px;font-weight:950;margin:22px 0 10px;color:#17243a;letter-spacing:-.015em;border-left:4px solid var(--purple);padding:7px 0 7px 11px;background:#faf9ff;border-radius:0 9px 9px 0}.resp-heading:first-child{margin-top:0}.response-content ul,.response-content ol{margin:7px 0 17px;padding:0;list-style:none}.response-content li{position:relative;margin:8px 0;padding:9px 12px 9px 28px;background:#f8fafc;border:1px solid #e8edf3;border-radius:10px}.response-content li:before{content:"•";position:absolute;left:12px;top:8px;font-weight:950;color:var(--purple);font-size:18px;line-height:1}.response-content ol{counter-reset:resp}.response-content ol li{counter-increment:resp;padding-left:39px}.response-content ol li:before{content:counter(resp);left:11px;top:8px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#eef1ff;color:#5945c7;font-size:11px}.resp-callout{background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:10px 0 14px}.resp-label{font-weight:950;color:#3e4c63}.resp-inline-label{font-weight:900;color:#26364f}.response-empty{color:#98a2b3}.research-layer{border-left:5px solid var(--purple)}.research-pink{border-left-color:var(--pink)}.research-cyan{border-left-color:var(--cyan)}.research-green{border-left-color:var(--green)}.research-orange{border-left-color:var(--orange)}.research-blue{border-left-color:var(--blue)}.research-layer .response-top{background:linear-gradient(135deg,#fff,#fafbff)}.research-more-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.research-more-bar small{color:var(--muted);font-weight:750}.research-pass-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:900}.research-pass-dot{width:8px;height:8px;border-radius:50%;background:var(--purple)}.research-more-empty{padding:13px;border:1px dashed #d8deea;border-radius:12px;color:var(--muted);font-size:12px;background:#fbfcfe}.loading{display:flex;align-items:center;gap:9px;color:#667085;padding:18px}.spinner{width:16px;height:16px;border:2px solid #dfe5ee;border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.notice{padding:11px 13px;background:#fff8ed;border:1px solid #fed7aa;border-radius:11px;color:#9a3412;font-size:13px}.success{background:#ecfdf3;border-color:#bbf7d0;color:#166534}.error-box{margin:15px;padding:13px;border-radius:12px;background:#fff2f4;border:1px solid #ffd0d7;color:#a61b35;font-size:13px}
.doc{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:10px;background:#fff}.doc b{display:block}.doc small{color:var(--muted)}.footer{margin-top:19px;text-align:center;color:#98a2b3;font-size:12px}
.section-note{padding:10px 12px;border-radius:11px;background:#f7f9fc;border:1px solid var(--line);font-size:12px;color:#667085}
@media(max-width:1020px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.grid,.hero-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.main{padding:18px}.grid,.hero-grid,.row,.agenda-board{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.top{display:block}.status{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="./un-knowledge.js"></script>
<script src="./mun-intelligence.js"></script>
<script src="./niv-engine.js"></script>
<script>
var K="munai-pages-v2";
var state={};try{state=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){state={}};
/* migrate the earlier one-agenda build */
if(!state.profile && state.__old){state.profile=state.__old}
state.profile=state.profile||{};
if(!state.profile.agenda1 && state.profile.agenda){state.profile.agenda1=state.profile.agenda}
state.profile.name=state.profile.name||"MUN 1";
state.profile.country=state.profile.country||"";
state.profile.committee=state.profile.committee||"";
state.profile.agenda1=state.profile.agenda1||"";
state.profile.agenda2=state.profile.agenda2||"";
state.keys=state.keys||{ollama:"",groq:"",mistral:"",unlimitless:"",provider:"auto"};
state.keys.ollama=state.keys.ollama||"";
delete state.keys.openai;
if(state.keys.provider==="openai")state.keys.provider="auto";
state.keys.provider=state.keys.provider||"auto";
var urlParams=new URLSearchParams(location.search);
var ollamaOnly=urlParams.get("ollama")==="1" || urlParams.get("provider")==="ollama";
if(ollamaOnly)state.keys.provider="ollama";
state.docs=Array.isArray(state.docs)?state.docs:[];
state.research=state.research||"";
state.researchMore=state.researchMore&&typeof state.researchMore==="object"?state.researchMore:{};
state.researchMorePasses=state.researchMorePasses&&typeof state.researchMorePasses==="object"?state.researchMorePasses:{};
state.strategy=state.strategy||"";
state.speech=state.speech||"";
state.resolution=state.resolution||"";
state.niv=state.niv||"";
state.nivHistory=Array.isArray(state.nivHistory)?state.nivHistory:[];
state.focus=state.focus||"both";
var tab="home";
function save(){localStorage.setItem(K,JSON.stringify(state))}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])})}
var tabs=[["home","⌂","Home"],["profile","◎","Delegate Profile"],["research","⌕","Research"],["researchmore","✦","Research More"],["strategy","⚑","Strategy Lab"],["speech","◉","Speech Studio"],["resolution","▤","Resolution Studio"],["niv","✦","Niv AI"],["documents","▥","Saved Documents"],["settings","⚙","API Settings"]];
function title(){var m={home:"Home",profile:"Delegate Profile",research:"Research",researchmore:"Research More",strategy:"Strategy Lab",speech:"Speech Studio",resolution:"Resolution Studio",niv:"Niv AI",documents:"Saved Documents",settings:"API Settings"};return m[tab]||"MUN AI"}
function navHtml(){var h="";for(var i=0;i<tabs.length;i++){h+="<button class='"+(tab===tabs[i][0]?"active":"")+"' data-tab='"+tabs[i][0]+"'>"+tabs[i][1]+" &nbsp; "+tabs[i][2]+"</button>"}return h}
function agendaLabel(a){return a==="agenda1"?"Agenda 1":a==="agenda2"?"Agenda 2":"Both agendas"}
function selectedAgendas(){
if(state.focus==="agenda1")return state.profile.agenda1||"Agenda 1 not configured";
if(state.focus==="agenda2")return state.profile.agenda2||"Agenda 2 not configured";
return "Agenda 1: "+(state.profile.agenda1||"Not configured")+"\\nAgenda 2: "+(state.profile.agenda2||"Not configured");
}
function agendaSummary(){
var a1=state.profile.agenda1||"Agenda 1 not configured",a2=state.profile.agenda2||"Agenda 2 not configured";
return "<div class='agenda-board'><div class='agenda-card'><small>Agenda 1</small><b>"+esc(a1)+"</b><p>"+(a1==="Agenda 1 not configured"?"Add the first agenda in your profile.":"Ready for research, strategy and drafting.")+"</p></div><div class='agenda-card a2'><small>Agenda 2</small><b>"+esc(a2)+"</b><p>"+(a2==="Agenda 2 not configured"?"Optional second agenda.":"Ready to work alongside Agenda 1.")+"</p></div></div>"
}
function researchKey(mode){return [mode,state.profile.country||"",state.profile.committee||"",state.profile.agenda1||"",state.profile.agenda2||"",state.focus||"both"].join("||")}
function researchPasses(mode){var k=researchKey(mode);return Array.isArray(state.researchMorePasses[k])?state.researchMorePasses[k]:[]}
function researchColors(){return ["pink","cyan","green","orange","blue"]}
function formatResearchLayers(mode){var passes=researchPasses(mode);if(!passes.length)return "<div class='research-more-empty'>No additional research yet. Run the main analysis first, then use <b>Research More</b> to deepen it.</div>";var h="";for(var i=0;i<passes.length;i++){var p=passes[i]||{};var n=i+1;var color=researchColors()[i]||"blue";var layer=formatResponse(p.content||"", "Research More · Pass "+n, p.provider||state.provider||"AI");layer=layer.replace("<div class='response-shell'>","<div class='response-shell research-layer research-"+color+"'>");h+=layer}return h}
function researchMoreBar(mode){var count=researchPasses(mode).length;var disabled=count>=5?" disabled":"";return "<div class='research-more-bar'><div><span class='research-pass-chip'><span class='research-pass-dot'></span>"+count+"/5 research passes</span><small style='margin-left:8px'>Each pass re-checks the country stance, agenda context, evidence gaps and decision-changing information.</small></div><button class='btn "+(disabled?"ghost":"primary")+"' id='researchMoreBtn'"+disabled+">"+(disabled?"5 passes complete":"Research More · Pass "+(count+1)+"</button></div><div id='researchMoreOut'>"+formatResearchLayers(mode)+"</div>"}
function aiPage(h,mode,lead,def){
return "<section class='card'><h2>"+h+"</h2><p class='lead'>"+lead+"</p><div class='agenda-picker'><span class='label'>Work on</span><button class='focus-btn "+(state.focus==="agenda1"?"active":"")+"' data-focus='agenda1'>Agenda 1</button><button class='focus-btn "+(state.focus==="agenda2"?"active":"")+"' data-focus='agenda2'>Agenda 2</button><button class='focus-btn "+(state.focus==="both"?"active":"")+"' data-focus='both'>Both agendas</button></div><div class='meta-strip'><span class='meta-chip'>Country: "+esc(state.profile.country||"Not set")+"</span><span class='meta-chip'>Committee: "+esc(state.profile.committee||"Not set")+"</span><span class='meta-chip'>Focus: "+agendaLabel(state.focus)+"</span></div><div class='form' style='margin-top:13px'><textarea class='textarea' id='prompt' placeholder='What should MUN AI do?'>"+esc(state[mode+"Prompt"]||def)+"</textarea><div class='toolbar'><button class='btn primary' id='runAI'>Run "+h+"</button><button class='btn light' id='saveOutput'>Save response</button></div></div><div id='out'>"+formatResponse(state[mode]||"",h,state.provider||"")+"</div>"+researchMoreBar(mode)+"</section>
}
function formatResponse(text,heading,provider){
if(!text)return "<div class='response-shell'><div class='response-top'><div class='response-title'>"+heading+" response</div><div class='response-provider'>Ready</div></div><div class='response-content response-empty'>Your response will appear here with clear sections, bullets and key callouts.</div></div>";
var raw=String(text).replace(/\r/g,"").trim();
raw=raw.replace(/\s*---\s*(?=###\s+)/g,"\n").replace(/\s+(?=###\s+)/g,"\n").replace(/\s+([-•])\s+(?=\*\*)/g,"\n$1 ");
var lines=raw.split(/\n+/),html="<div class='response-shell'><div class='response-top'><div class='response-title'>"+heading+" response</div><div class='response-provider'>"+esc(provider||"AI")+"</div></div><div class='response-content'>";
var inList=false,ol=false;
function closeList(){if(inList){html+="</"+(ol?"ol":"ul")+">";inList=false}}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>")}
for(var i=0;i<lines.length;i++){
var line=lines[i].trim();if(!line){closeList();continue}
var m=line.match(/^#{1,3}\s+(.+)$/);if(m){closeList();html+="<div class='resp-heading'>"+inline(m[1])+"</div>";continue}
var bullet=line.match(/^[-•*]\s+(.+)$/);if(bullet){if(!inList||ol){closeList();html+="<ul>";inList=true;ol=false}var item=bullet[1],label=item.match(/^\*\*(.+?)\*\*\s*[-–—:]\s*(.+)$/);html+="<li>"+(label?"<span class='resp-inline-label'>"+esc(label[1])+"</span> — "+inline(label[2]):inline(item))+"</li>";continue}
var num=line.match(/^\d+[.)]\s+(.+)$/);if(num){if(!inList||!ol){closeList();html+="<ol>";inList=true;ol=true}html+="<li>"+inline(num[1])+"</li>";continue}
var bold=line.match(/^\*\*(.+?)\*\*\s*[:–—-]?\s*(.*)$/);if(bold){closeList();html+="<div class='resp-callout'><span class='resp-label'>"+esc(bold[1])+"</span>"+(bold[2]?" — "+inline(bold[2]):"")+"</div>";continue}
closeList();html+="<p>"+inline(line)+"</p>";
}
closeList();html+="</div></div>";return html;
}
function pageHtml(){
if(tab==="home")return "<section class='hero'><h2>Two agendas. One MUN workspace.</h2><p>MUN AI now lets you prepare for two committee agendas independently or together. Research, strategy, speeches, resolutions and Niv AI can be scoped to Agenda 1, Agenda 2 or both.</p><div class='hero-grid'><div>"+agendaSummary()+"</div><div class='card accentP'><h3>Response experience</h3><p class='muted'>AI outputs are presented as structured response cards with clear headings, bullets, callouts, provider status and one-click saving.</p><div class='meta-strip'><span class='meta-chip'>Agenda-aware</span><span class='meta-chip'>Readable sections</span><span class='meta-chip'>Copy-ready</span><span class='meta-chip'>Save locally</span></div></div></div></section><div class='grid'><div class='card accentC'><h3>Research</h3><p class='muted'>Build evidence-focused preparation for one agenda or both together.</p></div><div class='card accentO'><h3>Strategy Lab</h3><p class='muted'>Compare risks, arguments and alliances across your two agenda tracks.</p></div><div class='card accentG'><h3>Committee ready</h3><p class='muted'>Keep both agenda contexts in one delegate profile.</p></div></div>";
if(tab==="profile")return "<section class='card'><h2>Delegate Profile</h2><p class='lead'>Configure your country, committee and up to two agendas. Every AI feature uses this context.</p><div class='form'><div class='row'><div><label class='label'>MUN name</label><input class='input' id='name' value='"+esc(state.profile.name)+"'></div><div><label class='label'>Country</label><input class='input' id='country' value='"+esc(state.profile.country)+"'></div></div><div><label class='label'>Committee</label><input class='input' id='committee' value='"+esc(state.profile.committee)+"'></div><div class='agenda-board'><div class='agenda-card'><label class='label'>Agenda 1</label><input class='input' id='agenda1' value='"+esc(state.profile.agenda1)+"' placeholder='First agenda topic'></div><div class='agenda-card a2'><label class='label'>Agenda 2</label><input class='input' id='agenda2' value='"+esc(state.profile.agenda2)+"' placeholder='Second agenda topic (optional)'></div></div><div class='section-note'>Tip: leave Agenda 2 blank when a conference only has one topic. Use “Both agendas” in an AI tab when you want a combined comparison.</div><button class='btn primary' id='saveProfile'>Save profile</button></div></section>";

async function runResearchMore(mode){
var btn=document.getElementById("researchMoreBtn"),out=document.getElementById("researchMoreOut");

if(btn){btn.disabled=true;btn.textContent="Researching pass "+(passes.length+1)+"…"}

var key=provider==="groq"?state.keys.groq:provider==="mistral"?state.keys.mistral:"";
if(provider!=="ollama"&&!key){if(out)out.innerHTML="<div class='error-box'>Choose Ollama (local) or enter your own Groq/Mistral API key in AI Settings.</div>"+formatResearchLayers(mode);if(btn){btn.disabled=false;btn.textContent="Research More · Pass "+(passes.length+1)}return}
var delegateContext="Country/delegation: "+(state.profile.country||"Not set")+"\nCommittee: "+(state.profile.committee||"Not set")+"\nAgenda 1: "+(state.profile.agenda1||"Not configured")+"\nAgenda 2: "+(state.profile.agenda2||"Not configured")+"\nSelected focus: "+agendaLabel(state.focus);
var selected=selectedAgendas();
var stanceLock="COUNTRY-SPECIFIC STANCE LOCK:\nThe assigned country is the principal decision-maker. Test every recommendation against documented interests and positions of that country. Prefer government, Permanent Mission and UN evidence when available. Never infer an official position from geography, regional grouping, stereotypes or assumed alliances. Distinguish VERIFIED COUNTRY POSITION, STRATEGIC INFERENCE and MUN SIMULATION. Never invent votes, red lines, treaty positions or government preferences. If evidence is unavailable, say it is unknown and needs verification. Keep the selected agenda(s) and committee mandate active in every decision.";
var prior=previous;if(passes.length)prior=prior+"\n\nPRIOR RESEARCH PASSES:\n"+passes.slice(-4).map(function(p,i){return "PASS "+(i+1)+": "+String(p.content||"").slice(0,4500)}).join("\n\n");
var researchPrompt="You are performing Research More pass "+(passes.length+1)+" of 5. "+delegateContext+"\n\nSELECTED AGENDA CONTEXT:\n"+selected+"\n\n"+stanceLock+"\n\nORIGINAL USER REQUEST:\n"+prompt+"\n\nEXISTING ANALYSIS:\n"+String(prior).slice(0,12000)+"\n\nYour job is to go beyond the existing answer. Re-check country-specific evidence, identify missing or weak claims, find contradictions, surface relevant UN/MUN facts, test assumptions and highlight information that could actually change the delegate's decision. Do not merely rewrite the previous answer. Keep Agenda 1 and Agenda 2 separate unless comparison is necessary. Label uncertainty instead of inventing facts. Finish with concrete implications for the assigned country.";
try{
var system="You are a rigorous Model UN research analyst. "+delegateContext+". "+stanceLock+" Answer with concise Markdown and evidence-aware reasoning.";
var user=researchPrompt;
if(provider==="ollama"&&window.buildMUNUNContext)user+="\n\nLOCAL RESEARCH GROUNDING:\n"+String(window.buildMUNUNContext(system+"\n"+user)).slice(0,22000);
var endpoint=provider==="ollama"?"http://127.0.0.1:11435/v1/chat/completions":provider==="groq"?"https://api.groq.com/openai/v1/chat/completions":"https://api.mistral.ai/v1/chat/completions";
var model=provider==="ollama"?"llama3.2":provider==="groq"?"openai/gpt-oss-120b":"mistral-small-latest";var headers={"Content-Type":"application/json"};if(provider!=="ollama"&&key)headers.Authorization="Bearer "+key;
var endpoints=provider==="ollama"?["http://127.0.0.1:11435/v1/chat/completions","http://127.0.0.1:11434/v1/chat/completions"]:[endpoint];var r=null,txt="",lastError=null;
for(var ei=0;ei<endpoints.length;ei++){try{var controller=new AbortController();var timeout=setTimeout(function(){controller.abort()},90000);r=await fetch(endpoints[ei],{method:"POST",headers:headers,body:JSON.stringify({model:model,temperature:.12,max_tokens:2200,messages:[{role:"system",content:system},{role:"user",content:user}]}),signal:controller.signal});clearTimeout(timeout);txt=await r.text();if(r.ok)break;lastError=new Error("AI request failed ("+r.status+").")}catch(fe){lastError=fe&&fe.name==="AbortError"?new Error("Research More timed out after 90 seconds. Try the pass again or use a cloud API provider."):fe}}
if(!r)throw lastError||new Error("AI request failed.");var d={};try{d=JSON.parse(txt)}catch(e){throw new Error("The AI provider returned invalid JSON.")}if(!r.ok)throw new Error(d&&d.error&&(d.error.message||d.error.error)?(d.error.message||d.error.error):"AI request failed ("+r.status+").");var answer=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;if(!answer)throw new Error("No research answer was returned.");passes.push({content:String(answer),provider:provider==="ollama"?"Ollama (local)":provider,createdAt:new Date().toISOString()});state.researchMorePasses[researchKey(mode)]=passes;state.researchMore={lastMode:mode,lastPass:passes.length};state.provider=provider==="ollama"?"Ollama (local)":provider;save();if(out)out.innerHTML=formatResearchLayers(mode);if(btn){btn.disabled=passes.length>=5;btn.textContent=passes.length>=5?"5 passes complete":"Research More · Pass "+(passes.length+1)}}catch(e){if(out)out.innerHTML="<div class='error-box'><b>Research pass failed.</b><br>"+esc(e&&e.message?e.message:"AI request failed.")+"</div>"+formatResearchLayers(mode);if(btn){btn.disabled=false;btn.textContent="Research More · Pass "+(passes.length+1)}}

async function runAI(mode){
var out=document.getElementById("out");
var prompt=(document.getElementById("prompt").value||"").trim();
if(!prompt){out.innerHTML="<div class='error-box'>Enter a request first.</div>";return}
state[mode+"Prompt"]=prompt;save();
out.innerHTML="<div class='response-shell'><div class='loading'><span class='spinner'></span><span id='nivLoadingText'>Analyzing your request and selecting only relevant MUN context…</span></div></div>";
var preferred=ollamaOnly?"ollama":(state.keys.provider||"auto");if(preferred==="openai")preferred="auto";
var provider=preferred;
if(provider==="auto")provider=state.keys.groq?"groq":state.keys.mistral?"mistral":"";
var key=provider==="groq"?state.keys.groq:provider==="mistral"?state.keys.mistral:"";
if(provider!=="ollama"&&!key){out.innerHTML="<div class='error-box'>Choose <b>Ollama (local)</b> or enter your own Groq/Mistral API key in AI Settings.</div>";return}
var delegateContext="Country/delegation: "+(state.profile.country||"Not set")+"\nCommittee: "+(state.profile.committee||"Not set")+"\nAgenda 1: "+(state.profile.agenda1||"Not configured")+"\nAgenda 2: "+(state.profile.agenda2||"Not configured")+"\nSelected focus: "+agendaLabel(state.focus);
var selected=selectedAgendas();
var baseUser=prompt+"\n\nSELECTED AGENDA CONTEXT:\n"+selected;
var history="";
if(mode==="niv"&&state.nivHistory.length){
history=state.nivHistory.slice(-6).map(function(m){return String(m.role||"user").toUpperCase()+": "+String(m.content||"").slice(0,1800)}).join("\n\n");
}
var system="You are Niv AI, a practical Model UN tactical assistant. "+delegateContext+". Keep both agendas distinct when both are selected. Answer the user's request directly, use concise Markdown, and never invent facts or citations.";
var intelligence=window.buildNivIntelligenceContext?window.buildNivIntelligenceContext(state.profile.country||"",state.profile.committee||""):"";
intelligence=String(intelligence||"").slice(0,8000);
// First classify the request, then decide what reference material is actually worth
// sending. Tactical questions should not pay the latency cost of the full knowledge base.
var quickNivText=String(prompt||"").toLowerCase();
var fastAlliance=/(which countries|what countries|block with|form a block|bloc|coalition|ally|allies|alliance|partners|co-sponsor|sponsor)/.test(quickNivText);
var fastDirect=/(what should i do|next move|next step|what do i say|how do i respond|should i)/.test(quickNivText);
var needsUN=!fastAlliance&&!fastDirect || /(procedure|point of order|poo|motion|resolution|treaty|voting record|official position|latest|current|research|citation)/.test(quickNivText);
var compactUN="";
if(mode==="niv"&&needsUN&&window.buildMUNUNContext){
compactUN=String(window.buildMUNUNContext(system+"\n"+baseUser)).slice(0,10000);
}
var niv=window.buildNivPrompt?window.buildNivPrompt(prompt,delegateContext,compactUN+"\n\nMUN INTELLIGENCE:\n"+intelligence,history):null;
if(mode==="niv"&&niv)system=niv.system;
if(mode==="niv"&&window.buildNivTacticalContext){
  var tactical=window.buildNivTacticalContext(state.profile.country||"",state.profile.committee||"",state.profile.agenda1||"",state.profile.agenda2||"",prompt,niv&&niv.task||"general");
  system+="\n\nLOCAL TACTICAL RETRIEVAL — USE ONLY IF RELEVANT:\n"+String(tactical).slice(0,6500);
}
var user=baseUser+"\n\nRESPONSE CONTRACT:\n1. Answer the exact question first.\n2. Use only context that changes the answer.\n3. If this is a rapid tactical question, do not write a general briefing.\n4. Give concrete wording/actions when useful.\n5. Distinguish verified facts from strategic hypotheses.\n6. If a current country position is unknown locally, say so rather than inventing it.\n\nKeep the response under about "+(mode==="niv"&&niv&&niv.fast?"500":"900")+" words unless the user explicitly asks for more.";
if(mode!=="niv"&&provider==="ollama"&&window.buildMUNUNContext){
user+="\n\nLOCAL RESEARCH GROUNDING:\n"+String(window.buildMUNUNContext(system+"\n"+user)).slice(0,22000);
}
try{
var endpoint=provider==="ollama"?"http://127.0.0.1:11435/v1/chat/completions":provider==="groq"?"https://api.groq.com/openai/v1/chat/completions":"https://api.mistral.ai/v1/chat/completions";
var model=provider==="ollama"?"llama3.2":provider==="groq"?"openai/gpt-oss-120b":"mistral-small-latest";
var requestHeaders={"Content-Type":"application/json"};
if(provider!=="ollama"&&key)requestHeaders.Authorization="Bearer "+key;
var messages=[{role:"system",content:system}];
if(mode==="niv"&&state.nivHistory.length){
messages=messages.concat(state.nivHistory.slice(-6).map(function(m){return {role:m.role==="assistant"?"assistant":"user",content:String(m.content||"").slice(0,1800)}}));
}
messages.push({role:"user",content:user});
var endpoints=provider==="ollama"?["http://127.0.0.1:11435/v1/chat/completions","http://127.0.0.1:11434/v1/chat/completions"]:[endpoint];
var r=null,txt="",d={},lastError=null;
for(var ei=0;ei<endpoints.length;ei++){
try{
var controller=new AbortController();
var timeout=setTimeout(function(){controller.abort()},90000);
r=await fetch(endpoints[ei],{method:"POST",headers:requestHeaders,body:JSON.stringify({model:model,temperature:.15,max_tokens:mode==="niv"?1800:2800,messages:messages}),signal:controller.signal});
clearTimeout(timeout);
txt=await r.text();
if(r.ok)break;
lastError=new Error("AI request failed ("+r.status+").");
}catch(fetchError){
lastError=fetchError&&fetchError.name==="AbortError"?new Error("Niv AI timed out after 90 seconds. The request was reduced automatically; try again or use a cloud API provider."):fetchError;
}
}
if(!r)throw lastError||new Error("AI request failed.");
try{d=JSON.parse(txt)}catch(e){throw new Error("The AI provider returned invalid JSON.")}
if(!r.ok){
var apiMsg=d&&d.error&&(d.error.message||d.error.error)?(d.error.message||d.error.error):"AI request failed ("+r.status+").";
throw new Error(apiMsg);
}
var answer=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
if(!answer)throw new Error("No answer was returned by the AI provider.");
state[mode]=String(answer);
state.provider=provider==="ollama"?"Ollama (local)":provider;
if(mode==="niv")state.nivHistory=state.nivHistory.concat([{role:"user",content:prompt},{role:"assistant",content:String(answer)}]).slice(-12);
save();
out.innerHTML=formatResponse(state[mode],title(),state.provider);
}catch(e){
var msg=e&&e.message?e.message:"AI request failed.";
if(provider==="ollama"&&/Failed to fetch|NetworkError|Load failed|ERR_CONNECTION_REFUSED/i.test(msg)){
msg="Niv AI could not reach the local Ollama bridge. Run START-MUN-AI.bat and ensure Ollama is running with llama3.2 installed.";
}
out.innerHTML="<div class='error-box'><b>Response failed.</b><br>"+esc(msg)+"</div>";
}
}
