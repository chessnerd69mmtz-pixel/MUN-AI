<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUN AI</title>
<style>
:root{
--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--ink:#17243a;--muted:#667085;--line:#e4e9f1;
--cyan:#11b7d1;--green:#1fa774;--purple:#7c5cff;--pink:#e64a9b;--orange:#f4a11a;--red:#ee4770;--blue:#3c82f6;
--shadow:0 12px 34px rgba(20,32,55,.07);--shadow2:0 5px 18px rgba(20,32,55,.06)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none}
.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{background:rgba(255,255,255,.98);border-right:1px solid var(--line);padding:20px 15px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 5px 8px}
.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;display:grid;place-items:center;font-weight:950;font-size:20px;box-shadow:0 8px 20px rgba(124,92,255,.24)}
.brand b{font-size:20px;letter-spacing:-.02em}.brand b span{color:var(--purple)}.sub{font-size:9px;letter-spacing:.17em;color:#98a2b3;margin-top:2px}
.workspace{border:1px solid var(--line);background:linear-gradient(135deg,#fafbfd,#f6f9fc);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow2)}
.workspace small{color:var(--muted);display:block;font-size:11px}.workspace b{display:block;margin:4px 0;font-size:14px}
.agenda-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.agenda-mini div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.agenda-mini small{font-size:10px;color:#98a2b3}.agenda-mini strong{display:block;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:11px;color:#475467;transition:.16s}.nav button:hover{background:#f3f6f8;transform:translateX(1px)}.nav button.active{background:linear-gradient(135deg,#ecfbfe,#f0ecff);color:#166b7b;font-weight:850;box-shadow:inset 3px 0 0 var(--cyan)}
.sideActions{margin-top:auto;display:grid;gap:8px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:850;transition:.16s}.btn:hover{transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#18263a,#253750);color:#fff;box-shadow:0 8px 18px rgba(23,37,58,.16)}.ghost{background:#eef2f6;color:#334155}.light{background:#fff;border:1px solid var(--line);color:#475467}
.main{padding:28px 30px 50px;min-width:0}.top{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--purple);font-weight:950;text-transform:uppercase}.top h1{margin:4px 0 7px;font-size:31px;line-height:1.05;letter-spacing:-.03em}.status{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow2)}.status i{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px}
.hero{background:linear-gradient(135deg,#fff,#f5fbff 45%,#faf7ff);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.hero h2{margin:0 0 9px;font-size:27px;line-height:1.14;letter-spacing:-.02em}.hero p{margin:0;max-width:980px;color:var(--muted);line-height:1.7}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:17px}
.agenda-board{display:grid;grid-template-columns:1fr 1fr;gap:11px}.agenda-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}.agenda-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--cyan)}.agenda-card.a2:before{background:var(--purple)}.agenda-card small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#98a2b3;font-weight:900}.agenda-card b{display:block;margin-top:6px;font-size:15px}.agenda-card p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow2)}.card h2,.card h3{margin:0 0 7px}.card h2{font-size:22px;letter-spacing:-.02em}.card h3{font-size:16px}.lead,.muted{color:var(--muted);line-height:1.63}.accentC{border-top:4px solid var(--cyan)}.accentG{border-top:4px solid var(--green)}.accentP{border-top:4px solid var(--purple)}.accentO{border-top:4px solid var(--orange)}.accentR{border-top:4px solid var(--red)}.accentB{border-top:4px solid var(--blue)}
.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{display:block;font-size:12px;font-weight:900;color:#475467;margin-bottom:6px}.input,.textarea,.select{width:100%;padding:11px 12px;border:1px solid #d6dde8;border-radius:11px;background:#fff;color:var(--ink);outline:none;transition:.15s}.input:focus,.textarea:focus,.select:focus{border-color:#9c8cff;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.textarea{min-height:145px;resize:vertical;line-height:1.55}
.agenda-picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#f7f8fb;border:1px solid var(--line);border-radius:12px}.agenda-picker .label{margin:0 3px 0 0}.focus-btn{border:1px solid #d6dde8;background:#fff;color:#475467;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.focus-btn.active{background:#17253a;color:#fff;border-color:#17253a}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.meta-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.meta-chip{padding:7px 9px;background:#f4f6f9;border:1px solid #e5e9ef;border-radius:999px;font-size:11px;font-weight:800;color:#526072}
.response-shell{margin-top:15px;border:1px solid #dfe5ee;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(20,32,55,.05)}.response-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fbfcfe,#f8fbff)}.response-title{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5d6878}.response-provider{font-size:11px;font-weight:850;padding:6px 8px;border-radius:999px;background:#edf8f1;color:#13704e}.response-content{padding:18px;line-height:1.72;color:#26364f}.response-content p{margin:0 0 13px}.resp-heading{font-size:16px;font-weight:950;margin:20px 0 9px;color:#17243a;letter-spacing:-.01em}.resp-heading:first-child{margin-top:0}.response-content ul,.response-content ol{margin:5px 0 14px 20px;padding:0}.response-content li{margin:5px 0;padding-left:2px}.resp-callout{background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:9px 0 13px}.resp-label{font-weight:950;color:#4a5870}.response-empty{color:#98a2b3}.loading{display:flex;align-items:center;gap:9px;color:#667085;padding:18px}.spinner{width:16px;height:16px;border:2px solid #dfe5ee;border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.notice{padding:11px 13px;background:#fff8ed;border:1px solid #fed7aa;border-radius:11px;color:#9a3412;font-size:13px}.success{background:#ecfdf3;border-color:#bbf7d0;color:#166534}.error-box{margin:15px;padding:13px;border-radius:12px;background:#fff2f4;border:1px solid #ffd0d7;color:#a61b35;font-size:13px}
.doc{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:10px;background:#fff}.doc b{display:block}.doc small{color:var(--muted)}.footer{margin-top:19px;text-align:center;color:#98a2b3;font-size:12px}
.section-note{padding:10px 12px;border-radius:11px;background:#f7f9fc;border:1px solid var(--line);font-size:12px;color:#667085}
@media(max-width:1020px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.grid,.hero-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.main{padding:18px}.grid,.hero-grid,.row,.agenda-board{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.top{display:block}.status{display:inline-block;margin-top:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var K="munai-pages-v2";
var state={};try{state=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){state={}};
/* migrate the earlier one-agenda build */
if(!state.profile && state.__old){state.profile=state.__old}
state.profile=state.profile||{};
if(!state.profile.agenda1 && state.profile.agenda){state.profile.agenda1=state.profile.agenda}
state.profile.name=state.profile.name||"MUN 1";
state.profile.country=state.profile.country||"";
state.profile.committee=state.profile.committee||"";
state.profile.agenda1=state.profile.agenda1||"";
state.profile.agenda2=state.profile.agenda2||"";
state.keys=state.keys||{groq:"",mistral:"",unlimitless:""};
state.docs=Array.isArray(state.docs)?state.docs:[];
state.research=state.research||"";
state.strategy=state.strategy||"";
state.speech=state.speech||"";
state.resolution=state.resolution||"";
state.niv=state.niv||"";
state.focus=state.focus||"both";
var tab="home";
function save(){localStorage.setItem(K,JSON.stringify(state))}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])})}
var tabs=[["home","⌂","Home"],["profile","◎","Delegate Profile"],["research","⌕","Research"],["strategy","⚑","Strategy Lab"],["speech","◉","Speech Studio"],["resolution","▤","Resolution Studio"],["niv","✦","Niv AI"],["documents","▥","Saved Documents"],["settings","⚙","API Settings"]];
function title(){var m={home:"Home",profile:"Delegate Profile",research:"Research",strategy:"Strategy Lab",speech:"Speech Studio",resolution:"Resolution Studio",niv:"Niv AI",documents:"Saved Documents",settings:"API Settings"};return m[tab]||"MUN AI"}
function navHtml(){var h="";for(var i=0;i<tabs.length;i++){h+="<button class='"+(tab===tabs[i][0]?"active":"")+"' data-tab='"+tabs[i][0]+"'>"+tabs[i][1]+" &nbsp; "+tabs[i][2]+"</button>"}return h}
function agendaLabel(a){return a==="agenda1"?"Agenda 1":a==="agenda2"?"Agenda 2":"Both agendas"}
function selectedAgendas(){
if(state.focus==="agenda1")return state.profile.agenda1||"Agenda 1 not configured";
if(state.focus==="agenda2")return state.profile.agenda2||"Agenda 2 not configured";
return "Agenda 1: "+(state.profile.agenda1||"Not configured")+"\\nAgenda 2: "+(state.profile.agenda2||"Not configured");
}
function agendaSummary(){
var a1=state.profile.agenda1||"Agenda 1 not configured",a2=state.profile.agenda2||"Agenda 2 not configured";
return "<div class='agenda-board'><div class='agenda-card'><small>Agenda 1</small><b>"+esc(a1)+"</b><p>"+(a1==="Agenda 1 not configured"?"Add the first agenda in your profile.":"Ready for research, strategy and drafting.")+"</p></div><div class='agenda-card a2'><small>Agenda 2</small><b>"+esc(a2)+"</b><p>"+(a2==="Agenda 2 not configured"?"Optional second agenda.":"Ready to work alongside Agenda 1.")+"</p></div></div>"
}
function aiPage(h,mode,lead,def){
return "<section class='card'><h2>"+h+"</h2><p class='lead'>"+lead+"</p><div class='agenda-picker'><span class='label'>Work on</span><button class='focus-btn "+(state.focus==="agenda1"?"active":"")+"' data-focus='agenda1'>Agenda 1</button><button class='focus-btn "+(state.focus==="agenda2"?"active":"")+"' data-focus='agenda2'>Agenda 2</button><button class='focus-btn "+(state.focus==="both"?"active":"")+"' data-focus='both'>Both agendas</button></div><div class='meta-strip'><span class='meta-chip'>Country: "+esc(state.profile.country||"Not set")+"</span><span class='meta-chip'>Committee: "+esc(state.profile.committee||"Not set")+"</span><span class='meta-chip'>Focus: "+agendaLabel(state.focus)+"</span></div><div class='form' style='margin-top:13px'><textarea class='textarea' id='prompt' placeholder='What should MUN AI do?'>"+esc(state[mode+"Prompt"]||def)+"</textarea><div class='toolbar'><button class='btn primary' id='runAI'>Run "+h+"</button><button class='btn light' id='saveOutput'>Save response</button></div></div><div id='out'>"+formatResponse(state[mode]||"",h,state.provider||"")+"</div></section>"
}
function formatResponse(text,heading,provider){
if(!text)return "<div class='response-shell'><div class='response-top'><div class='response-title'>"+heading+" response</div><div class='response-provider'>Ready</div></div><div class='response-content response-empty'>Your response will appear here with clear sections, bullets and key callouts.</div></div>";
var lines=String(text).replace(/\\r/g,"").split("\\n"),html="<div class='response-shell'><div class='response-top'><div class='response-title'>"+heading+" response</div><div class='response-provider'>"+esc(provider||"AI")+"</div></div><div class='response-content'>";
var inList=false,ol=false;
function closeList(){if(inList){html+="</"+(ol?"ol":"ul")+">";inList=false}}
for(var i=0;i<lines.length;i++){
var line=lines[i].trim();
if(!line){closeList();continue}
var m=line.match(/^#{1,3}\\s+(.+)$/);
if(m){closeList();html+="<div class='resp-heading'>"+esc(m[1])+"</div>";continue}
var b=line.match(/^\\*\\*(.+?)\\*\\*\\s*:?\\s*(.*)$/);
if(b){closeList();html+="<div class='resp-callout'><span class='resp-label'>"+esc(b[1])+(b[2]?"</span><br>"+esc(b[2]):"</span>")+"</div>";continue}
var bullet=line.match(/^[-•*]\\s+(.+)$/);
if(bullet){if(!inList||ol){closeList();html+="<ul>";inList=true;ol=false}html+="<li>"+esc(bullet[1])+"</li>";continue}
var num=line.match(/^\\d+[.)]\\s+(.+)$/);
if(num){if(!inList||!ol){closeList();html+="<ol>";inList=true;ol=true}html+="<li>"+esc(num[1])+"</li>";continue}
closeList();
html+="<p>"+esc(line).replace(/\\*\\*(.+?)\\*\\*/g,"<strong>$1</strong>")+"</p>";
}
closeList();html+="</div></div>";return html;
}
function pageHtml(){
if(tab==="home")return "<section class='hero'><h2>Two agendas. One MUN workspace.</h2><p>MUN AI now lets you prepare for two committee agendas independently or together. Research, strategy, speeches, resolutions and Niv AI can be scoped to Agenda 1, Agenda 2 or both.</p><div class='hero-grid'><div>"+agendaSummary()+"</div><div class='card accentP'><h3>Response experience</h3><p class='muted'>AI outputs are presented as structured response cards with clear headings, bullets, callouts, provider status and one-click saving.</p><div class='meta-strip'><span class='meta-chip'>Agenda-aware</span><span class='meta-chip'>Readable sections</span><span class='meta-chip'>Copy-ready</span><span class='meta-chip'>Save locally</span></div></div></div></section><div class='grid'><div class='card accentC'><h3>Research</h3><p class='muted'>Build evidence-focused preparation for one agenda or both together.</p></div><div class='card accentO'><h3>Strategy Lab</h3><p class='muted'>Compare risks, arguments and alliances across your two agenda tracks.</p></div><div class='card accentG'><h3>Committee ready</h3><p class='muted'>Keep both agenda contexts in one delegate profile.</p></div></div>";
if(tab==="profile")return "<section class='card'><h2>Delegate Profile</h2><p class='lead'>Configure your country, committee and up to two agendas. Every AI feature uses this context.</p><div class='form'><div class='row'><div><label class='label'>MUN name</label><input class='input' id='name' value='"+esc(state.profile.name)+"'></div><div><label class='label'>Country</label><input class='input' id='country' value='"+esc(state.profile.country)+"'></div></div><div><label class='label'>Committee</label><input class='input' id='committee' value='"+esc(state.profile.committee)+"'></div><div class='agenda-board'><div class='agenda-card'><label class='label'>Agenda 1</label><input class='input' id='agenda1' value='"+esc(state.profile.agenda1)+"' placeholder='First agenda topic'></div><div class='agenda-card a2'><label class='label'>Agenda 2</label><input class='input' id='agenda2' value='"+esc(state.profile.agenda2)+"' placeholder='Second agenda topic (optional)'></div></div><div class='section-note'>Tip: leave Agenda 2 blank when a conference only has one topic. Use “Both agendas” in an AI tab when you want a combined comparison.</div><button class='btn primary' id='saveProfile'>Save profile</button></div></section>";
if(tab==="settings")return "<section class='card'><h2>API Settings</h2><p class='lead'>Enter your own keys. They are saved only in this browser and are not committed to GitHub.</p><div class='form'><div><label class='label'>Groq API key</label><input class='input' id='groq' type='password' value='"+esc(state.keys.groq)+"' placeholder='gsk_...'></div><div><label class='label'>Mistral API key</label><input class='input' id='mistral' type='password' value='"+esc(state.keys.mistral)+"'></div><div><label class='label'>Unlimitless API key</label><input class='input' id='unlimitless' type='password' value='"+esc(state.keys.unlimitless)+"'></div><button class='btn primary' id='saveKeys'>Save keys locally</button><div class='toolbar'><a class='btn ghost' href='https://console.groq.com/keys' target='_blank'>Get Groq key</a><a class='btn ghost' href='https://console.mistral.ai/api-keys' target='_blank'>Get Mistral key</a><a class='btn ghost' href='https://unlimitless.ai/portal' target='_blank'>Get Unlimitless key</a></div><div class='notice'>Your browser may block direct provider requests because of CORS. The page itself and local workspace remain usable.</div></div></section>";
if(tab==="research")return aiPage("Research","research","Generate an evidence-focused briefing with facts, frameworks, arguments, risks and source directions.","Research this agenda carefully. Distinguish Agenda 1 and Agenda 2 clearly when both are selected, and identify where their policy considerations overlap or conflict.");
if(tab==="strategy")return aiPage("Strategy Lab","strategy","Turn research into arguments, vulnerabilities, responses and alliance moves.","For the selected agenda track(s), give me strongest arguments, likely attacks with responses, alliance targets and the most important committee priority. Keep the two agendas distinct when both are selected.");
if(tab==="speech")return aiPage("Speech Studio","speech","Draft a natural spoken MUN speech from the selected agenda context.","Write a confident, diplomatic 90-second GSL speech. Stay tightly focused on the selected agenda context and avoid mixing the two agendas unless I selected both.");
if(tab==="resolution")return aiPage("Resolution Studio","resolution","Draft realistic preambulatory and operative clauses from the selected agenda context.","Draft a practical MUN resolution with implementable operative clauses. If both agendas are selected, keep the resolution organized so it is clear which clauses address each agenda.");
if(tab==="niv")return aiPage("Niv AI","niv","Ask for a direct next move, response, POI or alliance approach using the selected agenda context.","Give me the next best move in committee and exact wording I can use. When both agendas are selected, tell me which agenda the move belongs to.");
if(tab==="documents"){var list="";for(var i=0;i<state.docs.length;i++){list+="<div class='doc'><b>"+esc(state.docs[i].title)+"</b><small>"+new Date(state.docs[i].createdAt).toLocaleString()+"</small><div style='margin-top:9px'>"+formatResponse(state.docs[i].content,state.docs[i].title,"Saved")+"</div><div class='toolbar' style='margin-top:8px'><button class='btn ghost' data-copy='"+i+"'>Copy</button><button class='btn ghost' data-del='"+i+"'>Delete</button></div></div>"}if(!list)list="<div class='notice'>No saved documents yet.</div>";return "<section class='card'><h2>Saved Documents</h2><p class='lead'>Saved locally in this browser. Responses keep their readable formatting when stored.</p><div class='form'><input class='input' id='docTitle' placeholder='Document title'><textarea class='textarea' id='docContent' placeholder='Paste or write a document here'></textarea><button class='btn primary' id='saveDoc'>Save document</button></div><div style='margin-top:18px'>"+list+"</div></section>"}
return "";
}
function render(){
document.getElementById("root").innerHTML="<div class='app'><aside class='sidebar'><div class='brand'><div class='mark'>M</div><div><b>MUN <span>AI</span></b><div class='sub'>DELEGATE INTELLIGENCE</div></div></div><div class='workspace'><small>Current workspace</small><b>"+esc(state.profile.name)+"</b><small>"+esc(state.profile.country||"Set country")+" · "+esc(state.profile.committee||"Set committee")+"</small>"+agendaSummary()+"</div><nav class='nav'>"+navHtml()+"</nav><div class='sideActions'><button class='btn primary' id='newMUN'>＋ New MUN workspace</button><button class='btn ghost' id='reset'>↻ Reset outputs</button></div></aside><main class='main'><header class='top'><div><div class='eyebrow'>"+esc(state.profile.name)+"</div><h1>"+title()+"</h1><div class='muted'>"+esc(state.profile.country||"Your delegation")+" · "+esc(state.profile.committee||"Committee not configured")+"</div></div><div class='status'><i></i>GitHub Pages</div></header>"+pageHtml()+"<div class='footer'>MUN AI · chessnerd69mmtz-pixel.github.io/MUN-AI</div></main></div>";
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-tab");render()}});
document.querySelectorAll("[data-focus]").forEach(function(b){b.onclick=function(){state.focus=b.getAttribute("data-focus");save();render()}});
var np=document.getElementById("newMUN");if(np)np.onclick=function(){state.profile={name:"MUN 1",country:"",committee:"",agenda1:"",agenda2:""};state.docs=[];state.research="";state.strategy="";state.speech="";state.resolution="";state.niv="";state.focus="both";save();render()};
var rs=document.getElementById("reset");if(rs)rs.onclick=function(){state.research="";state.strategy="";state.speech="";state.resolution="";state.niv="";save();render()};
if(tab==="profile"){document.getElementById("saveProfile").onclick=function(){state.profile.name=document.getElementById("name").value||"MUN 1";state.profile.country=document.getElementById("country").value;state.profile.committee=document.getElementById("committee").value;state.profile.agenda1=document.getElementById("agenda1").value;state.profile.agenda2=document.getElementById("agenda2").value;save();render()}}
if(tab==="settings"){document.getElementById("saveKeys").onclick=function(){state.keys.groq=document.getElementById("groq").value.trim();state.keys.mistral=document.getElementById("mistral").value.trim();state.keys.unlimitless=document.getElementById("unlimitless").value.trim();save();alert("Keys saved locally in this browser.")}}
if(["research","strategy","speech","resolution","niv"].indexOf(tab)>=0){
document.getElementById("runAI").onclick=function(){runAI(tab)};
document.getElementById("saveOutput").onclick=function(){var text=state[tab]||"";if(!text)return;state.docs.unshift({title:title()+" · "+agendaLabel(state.focus),content:text,createdAt:new Date().toISOString()});save();tab="documents";render()}
}
if(tab==="documents"){document.getElementById("saveDoc").onclick=function(){var c=document.getElementById("docContent").value.trim();if(!c)return;state.docs.unshift({title:document.getElementById("docTitle").value.trim()||"Untitled document",content:c,createdAt:new Date().toISOString()});save();render()};document.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(state.docs[Number(b.getAttribute("data-copy"))].content)}});document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){state.docs.splice(Number(b.getAttribute("data-del")),1);save();render()}})}
}
async function runAI(mode){
var out=document.getElementById("out");var prompt=document.getElementById("prompt").value;state[mode+"Prompt"]=prompt;save();
out.innerHTML="<div class='response-shell'><div class='loading'><span class='spinner'></span><span>Building a structured "+esc(title().toLowerCase())+" response for "+esc(agendaLabel(state.focus).toLowerCase())+"…</span></div></div>";
var key=state.keys.groq||state.keys.mistral;if(!key){out.innerHTML="<div class='error-box'>Open API Settings and enter your own Groq or Mistral key first.</div>";return}
var groq=!!state.keys.groq;var endpoint=groq?"https://api.groq.com/openai/v1/chat/completions":"https://api.mistral.ai/v1/chat/completions";var model=groq?"openai/gpt-oss-120b":"mistral-small-latest";
var system="You are MUN AI, a careful Model United Nations preparation assistant. Country: "+state.profile.country+" Committee: "+state.profile.committee+". The delegate may be working on two agendas. Agenda 1: "+(state.profile.agenda1||"not configured")+". Agenda 2: "+(state.profile.agenda2||"not configured")+". Selected focus: "+agendaLabel(state.focus)+". Do not invent facts or citations. Use clear headings, short paragraphs and bullets. When both agendas are selected, label each agenda explicitly and separate shared points from agenda-specific points.";
var user=prompt+"\\n\\nSelected agenda context:\\n"+selectedAgendas()+"\\n\\nProduce a polished MUN-ready response.";
try{
var r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:model,temperature:.25,messages:[{role:"system",content:system},{role:"user",content:user}]})});
var txt=await r.text();var d={};try{d=JSON.parse(txt)}catch(e){}
if(!r.ok)throw new Error((d.error&&d.error.message)||("AI request failed ("+r.status+")"));
var ans=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"No answer returned.";
state[mode]=ans;state.provider=groq?"Groq":"Mistral";save();out.innerHTML=formatResponse(ans,title(),state.provider);
}catch(e){out.innerHTML="<div class='error-box'><b>Response failed.</b><br>"+esc(e.message||"AI request failed.")+"</div>"}
}
render();
</script>
</body>
</html>
